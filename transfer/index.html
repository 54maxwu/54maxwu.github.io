<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>裝置快傳</title>
<link rel="stylesheet" href="style.css">
<script defer src="../qrcode/jquery-3.7.1.min.js"></script>
<script defer src="../qrcode/jquery.qrcode.min.js"></script>
<script type="module" src="app.js"></script>
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="i-room" viewBox="0 0 24 24"><path fill="currentColor" d="M1 2h22v2H1zm0 18h22v2H1zm11-14a3 3 0 1 1 0 6 3 3 0 0 1 0-6ZM5 7a2 2 0 1 1 0 4 2 2 0 0 1 0-4Zm14 0a2 2 0 1 1 0 4 2 2 0 0 1 0-4ZM6 17c0-5 12-5 12 0v1H6zm-5-1c0-3 4-4 6-3-2 1-3 3-3 5H1zm22 0v2h-3c0-2-1-4-3-5 2-1 6 0 6 3Z"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="m10 13 4-4m-6 6-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m2 12a4 4 0 0 0 6 0l4-4a4 4 0 0 0-6-6l-1 1" transform="rotate(-17 12 12) translate(1 1) scale(.91)" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a2 2 0 0 0-2 2c-3 1-4 3-4 6v4l-2 3v2h16v-2l-2-3v-4c0-3-1-5-4-6a2 2 0 0 0-2-2Zm-2 18a2 2 0 1 0 4 0Z"/></symbol>
  <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path fill="currentColor" d="M12 3a9 9 0 0 0 0 18Z"/></symbol>
  <symbol id="i-device" viewBox="0 0 24 24"><path d="M2 4h20v13H2zm6 17h8m-4-4v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-radar" viewBox="0 0 80 80"><path d="M23 61a29 29 0 1 1 34 0M31 51a17 17 0 1 1 18 0" fill="none" stroke="currentColor" stroke-width="7"/><circle cx="40" cy="37" r="7" fill="currentColor"/></symbol>
</svg>
<header class="toolbar" aria-label="工具列">
  <button id="open-join" title="加入房間" aria-label="加入房間"><svg><use href="#i-room"/></svg></button>
  <button id="open-pair" title="配對裝置" aria-label="配對裝置"><svg><use href="#i-link"/></svg></button>
  <button id="notify" title="通知" aria-label="通知"><svg><use href="#i-bell"/></svg></button>
  <button id="theme" title="切換色彩主題" aria-label="切換色彩主題"><svg><use href="#i-theme"/></svg></button>
</header>
<main>
  <div id="empty"><h1>在另一台裝置上開啟裝置快傳</h1><p>建立邀請或加入私人房間，即可互傳檔案和文字</p></div>
  <button id="device" hidden><span><svg><use href="#i-device"/></svg></span>已配對的裝置<small>點擊傳送檔案或文字</small></button>
</main>
<footer>
  <button id="radar" aria-label="配對裝置"><svg><use href="#i-radar"/></svg></button>
  <div>此裝置名稱為： <strong id="device-name">我的裝置</strong> <button id="rename" aria-label="更改裝置名稱" title="更改裝置名稱">✎</button></div>
  <button id="visibility" class="visibility">可見於： <strong>私人房間</strong></button>
  <p id="status" role="status" aria-live="polite">尚未配對</p>
</footer>
<dialog id="pair-dialog">
  <button class="close" type="button" aria-label="關閉">×</button>
  <h2>配對裝置</h2>
  <div id="setup">
    <button id="create" class="primary">建立邀請</button>
    <form id="join">
      <label for="code">輸入配對碼以加入</label>
      <input id="code" maxlength="28" autocomplete="off" spellcheck="false" autocapitalize="characters" placeholder="XXXXX-XXXXX-XXXXX-XXXXX" required>
      <button type="submit">加入</button>
    </form>
    <details><summary>跨網路連線選項</summary><label for="relay">中繼密碼（兩台裝置都填）</label><input id="relay" type="password" maxlength="160" autocomplete="off"></details>
  </div>
  <div id="room" hidden>
    <div id="invite">
      <output id="room-code"></output>
      <div id="qr" role="img" aria-label="配對邀請 QR Code"></div>
      <p>用另一台裝置掃描 QR Code，或分享邀請連結。</p>
      <button id="copy" type="button">複製邀請連結</button>
    </div>
    <button id="leave" type="button">離開房間</button>
  </div>
  <p id="pair-status" role="status"></p>
</dialog>
<dialog id="send-dialog">
  <button class="close" type="button" aria-label="關閉">×</button>
  <h2>傳送檔案或文字</h2>
  <fieldset id="send-controls" disabled>
    <div id="drop"><label for="files">拖放檔案到這裡，或選擇檔案</label><input id="files" type="file" multiple><small>多檔最多 20 個、合計 128 MiB。單檔可達 10 GiB，大檔請用支援直接儲存的瀏覽器接收。</small></div>
    <p id="selection"></p><button id="send-files" class="primary" disabled>傳送檔案</button>
    <form id="text-form"><label for="message">傳送文字或連結</label><textarea id="message" rows="3" maxlength="8000"></textarea><button>傳送文字</button></form>
  </fieldset>
</dialog>
<dialog id="receive-dialog">
  <button class="close" type="button" aria-label="關閉">×</button>
  <h2>傳輸</h2>
  <div id="incoming" hidden>
    <p id="offer"></p>
    <button id="accept" class="primary">接受</button><button id="reject">拒絕</button>
  </div>
  <div id="activity" hidden>
    <p id="transfer-status" role="status"></p>
    <progress id="progress" max="1" value="0" aria-label="傳輸進度"></progress>
    <button id="cancel" type="button" hidden>取消傳輸</button>
  </div>
  <div id="received"></div>
</dialog>
<dialog id="notification-dialog" aria-labelledby="notification-title">
  <button class="close" type="button" aria-label="關閉">×</button>
  <h2 id="notification-title">通知</h2>
  <p id="notification-text"></p>
</dialog>
</body>
</html>
