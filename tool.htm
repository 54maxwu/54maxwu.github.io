<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tool Hub</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tool Hub">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>
/* ── Tokens ──────────────────────────────────────────── */
:root {
  --bg:        #0d1117;
  --panel:     #11161f;
  --card:      #151b26;
  --card-hi:   #1a2230;
  --line:      #232b3a;
  --line-hi:   #34405a;
  --text:      #d6dde6;
  --text-hi:   #f0f4f8;
  --muted:     #7d8796;
  --faint:     #4c5566;
  --accent:    #58a6ff;
  --amber:     #f0b429;
  --green:     #3fb950;
  --red:       #f85149;
  --mono: ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
  --ease-out: cubic-bezier(.2, .7, .2, 1);
  --topbar-h: 56px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-size: 14px;
}
button, input { font: inherit; color: inherit; }

/* Thin custom scrollbars everywhere */
* { scrollbar-width: thin; scrollbar-color: var(--line-hi) transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line-hi); border-radius: 4px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: #4a5878; }

/* ── Top bar ─────────────────────────────────────────── */
#topbar {
  height: var(--topbar-h);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 18px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
  overflow-y: hidden;
  white-space: nowrap;
}
#topbar::-webkit-scrollbar { height: 0; }

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 18px;
  font-weight: 700;
  color: var(--text-hi);
  margin-right: 8px;
  letter-spacing: .01em;
}
.brand-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); }

.stat {
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
  height: 36px;
  padding: 0 13px;
  line-height: 36px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--card);
  color: var(--muted);
  font-size: 13px;
}
.stat b { color: var(--amber); font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }

.top-btn {
  display: none;
  align-items: center;
  gap: 6px;
  height: 36px;
  padding: 0 14px;
  border: 1px solid var(--line-hi);
  border-radius: 8px;
  background: var(--card);
  color: var(--text-hi);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background .12s, border-color .12s, color .12s;
}
.top-btn.visible { display: inline-flex; }
.top-btn:hover { background: var(--card-hi); border-color: #4a5878; }
#close-all-btn .pip { width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
#close-all-btn:hover { border-color: var(--red); }

#clock {
  margin-left: auto;
  padding-left: 16px;
  color: var(--muted);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}

/* ── Main layout ─────────────────────────────────────── */
#main { flex: 1; min-height: 0; display: flex; }

/* ── Sidebar ─────────────────────────────────────────── */
#sidebar {
  width: 280px;
  min-width: 200px;
  max-width: 420px;
  flex-shrink: 0;
  position: relative;
  background: var(--panel);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px 12px 20px;
}
#sidebar > * { flex-shrink: 0; }

.side-title {
  padding: 0 10px 10px;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: .02em;
}

#cat-list { display: flex; flex-direction: column; gap: 2px; }

.cat {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  padding: 9px 12px;
  border: 1px solid transparent;
  border-radius: 8px;
  background: transparent;
  text-align: left;
  font-size: 15px;
  cursor: pointer;
  transition: background .12s, border-color .12s;
}
.cat:hover { background: var(--card); }
.cat.active { background: #172338; border-color: #24365a; }
.cat.active .cat-name { color: var(--accent); }
.cat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--c); }
.cat-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-count { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.cat.active .cat-count { color: var(--text-hi); }

#cat-bar {
  display: flex;
  height: 6px;
  margin: 12px 12px 0;
  border-radius: 3px;
  overflow: hidden;
  gap: 1px;
}
#cat-bar span { background: var(--c); }

.side-sep { height: 1px; background: var(--line); margin: 18px 4px 16px; }

#recent-list { display: flex; flex-direction: column; gap: 2px; }
.recent {
  display: grid;
  grid-template-columns: 8px 1fr auto;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 12px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  text-align: left;
  cursor: pointer;
  transition: background .12s;
}
.recent:hover { background: var(--card); }
.recent .cat-dot { width: 6px; height: 6px; }
.recent-name { font-size: 14px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent-time { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.recent-empty { padding: 4px 12px; font-size: 13px; color: var(--faint); }

#sidebar-resize {
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 8px;
  cursor: col-resize;
  z-index: 10;
}
#sidebar-resize:hover, #sidebar-resize.active {
  background: linear-gradient(to right, transparent 3px, var(--accent) 3px, var(--accent) 5px, transparent 5px);
}

/* ── Workspace ───────────────────────────────────────── */
#workspace { flex: 1; min-width: 0; display: flex; flex-direction: column; }

#tab-bar {
  display: flex;
  align-items: flex-end;
  height: 42px;
  flex-shrink: 0;
  padding: 0 10px;
  gap: 2px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
  overflow-y: hidden;
  user-select: none;
}
#tab-bar::-webkit-scrollbar { height: 3px; }
#tab-bar::-webkit-scrollbar-thumb { border: 0; }
#tabs-container { display: flex; align-items: flex-end; gap: 2px; height: 100%; }

.tab {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 33px;
  padding: 0 9px 0 12px;
  border: 1px solid transparent;
  border-bottom: none;
  border-radius: 7px 7px 0 0;
  color: var(--muted);
  font-size: 13px;
  white-space: nowrap;
  cursor: pointer;
  flex-shrink: 0;
  position: relative;
  touch-action: manipulation; /* 取消雙擊縮放，讓手機雙擊判定即時 */
  transition: background .12s, color .12s;
}
.tab:hover { background: var(--card); color: var(--text); }
.tab.active { background: var(--bg); color: var(--text-hi); border-color: var(--line); }
.tab.home { padding: 0 14px; font-weight: 600; }
.tab.home.active { color: var(--accent); }
.tab-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

.tab.drag-over-left::before,
.tab.drag-over-right::after {
  content: '';
  position: absolute;
  top: 4px; bottom: 4px;
  width: 3px;
  background: var(--accent);
  border-radius: 2px;
}
.tab.drag-over-left::before  { left: -2px; }
.tab.drag-over-right::after  { right: -2px; }
.tab.dragging { opacity: .35; }

.tab-name { max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
.tab-close {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 17px;
  height: 17px;
  border-radius: 4px;
  font-size: 15px;
  line-height: 1;
  color: var(--faint);
  flex-shrink: 0;
  transition: background .12s, color .12s;
}
.tab-close:hover { background: var(--red); color: #fff; }

#content { flex: 1; min-height: 0; position: relative; background: var(--bg); }

.iframe-pane { position: absolute; inset: 0; display: none; }
.iframe-pane.active { display: block; }
.iframe-pane iframe { width: 100%; height: 100%; border: none; background: var(--bg); }

/* ── Home (overview grid) ────────────────────────────── */
#home { position: absolute; inset: 0; display: flex; flex-direction: column; }
#home[hidden] { display: none; }

#toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px 0;
  flex-shrink: 0;
}
#search-wrap { position: relative; width: min(420px, 100%); }
#search {
  width: 100%;
  height: 40px;
  padding: 0 40px 0 14px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-hi);
  outline: none;
  transition: border-color .12s, box-shadow .12s;
}
#search::placeholder { color: var(--faint); }
#search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88, 166, 255, .14); }
#search-key {
  position: absolute;
  right: 10px; top: 50%;
  transform: translateY(-50%);
  padding: 1px 7px;
  border: 1px solid var(--line-hi);
  border-radius: 5px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  pointer-events: none;
}
#search:focus + #search-key { display: none; }

#result-count { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

#grid {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  grid-auto-rows: min-content;
  gap: 14px;
  padding: 16px 20px 24px;
  align-content: start;
}

.card {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 150px;
  padding: 14px 16px 14px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  text-align: left;
  cursor: pointer;
  transition: border-color .14s var(--ease-out), background .14s var(--ease-out), transform .14s var(--ease-out);
}
.card:hover { border-color: var(--line-hi); background: var(--card-hi); transform: translateY(-1px); }
.card:active { transform: translateY(0); }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card.is-open { border-color: #24365a; }

.card-head { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.badge {
  padding: 2px 8px;
  border-radius: 5px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--c);
  background: color-mix(in srgb, var(--c) 16%, transparent);
  white-space: nowrap;
}
.card-time { color: var(--muted); font-variant-numeric: tabular-nums; }
.card-uses { margin-left: auto; font-weight: 700; color: var(--green); font-variant-numeric: tabular-nums; }
.card-uses.zero { color: var(--faint); font-weight: 500; }

.card-title { font-size: 16px; font-weight: 600; color: var(--text-hi); line-height: 1.35; }
.card-desc { font-size: 13.5px; color: var(--muted); line-height: 1.55; flex: 1; }
.card-url {
  font-family: var(--mono);
  font-size: 12px;
  color: #6e9ad6;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.card:hover .card-url { text-decoration: underline; text-underline-offset: 3px; }

.card.enter { animation: card-in .22s var(--ease-out) both; animation-delay: var(--d, 0ms); }
@keyframes card-in {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}

#no-result {
  grid-column: 1 / -1;
  padding: 60px 0;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
}

/* ── Login overlay ───────────────────────────────────── */
#login-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
#login-box {
  width: 320px;
  padding: 32px 32px 28px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
#login-box h2 {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  font-size: 17px;
  font-weight: 700;
  color: var(--text-hi);
}
#login-input {
  width: 100%;
  height: 42px;
  padding: 0 14px;
  background: var(--bg);
  border: 1px solid var(--line-hi);
  border-radius: 8px;
  font-family: var(--mono);
  font-size: 14px;
  letter-spacing: 2px;
  color: var(--text-hi);
  outline: none;
  transition: border-color .12s, box-shadow .12s;
}
#login-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88, 166, 255, .14); }
#login-btn {
  height: 42px;
  border: none;
  border-radius: 8px;
  background: #238636;
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: background .12s;
}
#login-btn:hover { background: #2ea043; }
#login-btn:disabled { opacity: .6; cursor: wait; }
#login-err { min-height: 16px; font-size: 12px; color: var(--red); text-align: center; }

/* ── Confirm modal ───────────────────────────────────── */
#confirm-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .55);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9998;
  animation: fade-in .14s ease-out;
}
#confirm-overlay.visible { display: flex; }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
#confirm-box {
  min-width: 320px;
  max-width: 92vw;
  padding: 22px 24px 18px;
  background: var(--panel);
  border: 1px solid var(--line-hi);
  border-radius: 12px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, .5);
  display: flex;
  flex-direction: column;
  gap: 16px;
  animation: pop-in .18s var(--ease-out);
}
@keyframes pop-in { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
#confirm-title { font-size: 15px; font-weight: 700; color: var(--text-hi); }
#confirm-msg { font-size: 14px; color: var(--text); line-height: 1.55; }
#confirm-actions { display: flex; gap: 8px; justify-content: flex-end; }
.confirm-btn {
  height: 34px;
  padding: 0 16px;
  border: 1px solid var(--line-hi);
  border-radius: 7px;
  background: transparent;
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background .12s, border-color .12s;
}
.confirm-btn:hover { background: var(--card-hi); }
.confirm-btn.danger { background: #da3633; border-color: #da3633; color: #fff; }
.confirm-btn.danger:hover { background: var(--red); border-color: var(--red); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ── Mobile (≤ 760px) ────────────────────────────────── */
@media (max-width: 760px) {
  :root { --topbar-h: 50px; }
  #topbar { padding: 0 12px; gap: 8px; }
  .brand { font-size: 16px; margin-right: 2px; }
  .stat { height: 32px; line-height: 32px; padding: 0 10px; font-size: 12px; }
  .stat b { font-size: 15px; }
  .stat.opt, #clock { display: none; }
  .top-btn { height: 32px; padding: 0 10px; font-size: 12px; }

  #main { flex-direction: column; }
  #sidebar {
    width: 100% !important;
    min-width: 0;
    max-width: none;
    flex-direction: row;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 8px 12px;
    border-right: none;
    border-bottom: 1px solid var(--line);
  }
  #sidebar::-webkit-scrollbar { height: 0; }
  .side-title, #cat-bar, .side-sep, #recent-list, #sidebar-resize { display: none; }
  #cat-list { flex-direction: row; gap: 6px; }
  .cat { width: auto; padding: 6px 12px; font-size: 13px; gap: 7px; border-color: var(--line); white-space: nowrap; }
  .cat-count { font-size: 12px; }

  #toolbar { padding: 12px 12px 0; }
  #result-count { display: none; }
  #grid { grid-template-columns: 1fr; gap: 10px; padding: 12px 12px 20px; }
  .card { min-height: 0; }
  .tab-name { max-width: 96px; }
}
</style>
</head>
<body>

<div id="login-overlay">
  <div id="login-box">
    <h2><span class="brand-dot"></span>Tool Hub</h2>
    <input id="login-input" type="password" placeholder="請輸入通行碼" autocomplete="off" autofocus>
    <button id="login-btn">登入</button>
    <div id="login-err"></div>
  </div>
</div>

<header id="topbar">
  <div class="brand"><span class="brand-dot"></span>Tool Hub</div>
  <div class="stat"><b id="st-tools">0</b>個工具</div>
  <div class="stat"><b id="st-open">0</b>個分頁開啟</div>
  <div class="stat opt"><b id="st-total">0</b>次累計開啟</div>
  <div class="stat opt"><b id="st-top">—</b>最常用</div>
  <button class="top-btn" id="close-all-btn" title="關閉全部分頁"><span class="pip"></span>全部關閉</button>
  <button class="top-btn" id="install-btn" title="安裝為桌面 App">安裝 App</button>
  <div id="clock"></div>
</header>

<div id="confirm-overlay" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
  <div id="confirm-box">
    <div id="confirm-title">確認</div>
    <div id="confirm-msg"></div>
    <div id="confirm-actions">
      <button class="confirm-btn" id="confirm-cancel">取消</button>
      <button class="confirm-btn danger" id="confirm-ok">確定</button>
    </div>
  </div>
</div>

<div id="main">
  <aside id="sidebar">
    <div class="side-title">工具分類（點選篩選）</div>
    <div id="cat-list"></div>
    <div id="cat-bar" aria-hidden="true"></div>
    <div class="side-sep"></div>
    <div class="side-title">最近開啟</div>
    <div id="recent-list"></div>
    <div id="sidebar-resize"></div>
  </aside>

  <section id="workspace">
    <div id="tab-bar"><div id="tabs-container"></div></div>
    <div id="content">
      <div id="home">
        <div id="toolbar">
          <div id="search-wrap">
            <input id="search" type="search" placeholder="搜尋工具名稱 / 說明 / 路徑…" autocomplete="off" spellcheck="false">
            <kbd id="search-key">/</kbd>
          </div>
          <div id="result-count"></div>
        </div>
        <div id="grid"></div>
      </div>
    </div>
  </section>
</div>

<script>
// ╔══════════════════════════════════════════════════════╗
// ║  在這裡設定分類與工具清單                                     ║
// ║  分類：{ name, color, tools }                         ║
// ║  工具：{ id, name, url, color, desc }                  ║
// ╚══════════════════════════════════════════════════════╝
const TOOL_GROUPS = [
  { name: '加密與安全', color: '#f85149', tools: [
      { id: 'otp',             name: 'OTP 產生器',              url: 'OTP.htm',                    color: '#a855f7', desc: '輸入金鑰產生 TOTP 一次性驗證碼，倒數顯示剩餘秒數。' },
      { id: 'tip',             name: '文件加密',                url: 'tip/index.html',             color: '#06b6d4', desc: '用密碼把文字內容加密成可分享的密文頁面。' },
      { id: 'rsa',             name: 'RSA 加密 / 簽章工具',     url: 'rsa.htm',                    color: '#ef4444', desc: '產生金鑰對，進行 RSA 加解密與簽章驗證。' },
      { id: 'aes',             name: 'AES 加密 / 解密工具',     url: 'aes.htm',                    color: '#f97316', desc: 'AES-GCM / CBC 加解密，支援自訂金鑰與 IV。' },
      { id: 'aesecb',          name: 'AES ECB 加密 / 解密工具', url: 'aesecb.htm',                 color: '#ec4899', desc: 'AES-ECB 模式加解密，對接舊系統用。' },
  ] },

// ── RSA-PSS Login ────────────────────────────────────
(function () {
  const PUB_KEY_B64 = 'MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAmGXhsEcms3FNOxkRBSd2FmBaU8xo6WwRIkdPIjVoZYzvwTyXun0rpVHBNITO7bt/zAKNT+/3m5xwFSEtJflxjMVumW1Ci8IB1YyH+5O1sxweSOivHXFRoRteHRiYYQwf697EPdBMX1MZnsBhp05uH6EpOKfxII3mDldNlSN564ueiXVrKodzcOncK4/RG1c5TSNroYZCcpk4Vq5EemZsMbmhrklRFipB4fDPag6kPKlLME64Xl97gTkAJU1xr0lVqkeWrSQPy6f990tPlxKYtg12cIWLeo6cHhCSyt1yFD6kO0yk08fW8uo+8iqMj4ELz8beC1OsxKOvz+6Z4awnVQIDAQAB';
  const SIG_B64     = 'WfkbK13IFfxAcJLWmRi1+Y2ak9Y4UlTRqcceWrYT0+5yZtPjgNrO6bWPdsguaH7cX4wEGVAN7b0J94AvBv7gjNcurX/y9XcMiGk54KwUl68Zc7FZ1xKINtrRTbpDI/pEIJ5z7slhR3aGNjkixfyE65b9J3z8p814CeOjCCeL6yopcVPGLZcjDtoeWaG8CRY+UC0cMs6YW2Pc5zJnvqsmrahkEUnVS6Pwbe7uLUPATFy+JH+gWIH/8kf8CBHd/k3oMb9tkjXTVL0Eq1IIqLEERynt/YiGjqwBn9YVgaeteW6hF8FGqCUzrHKDd9BUMsRtFpNhZ6g4Qw3WKkJKhfX4ew==';
  const SALT_LEN    = 32;
  const SS_KEY      = 'toolhub_auth';

  function b64ToBytes(b64) {
    const bin = atob(b64);
    return Uint8Array.from(bin, c => c.charCodeAt(0));
  }

  async function verify(password) {
    const keyData = b64ToBytes(PUB_KEY_B64);
    const pubKey  = await crypto.subtle.importKey(
      'spki', keyData,
      { name: 'RSA-PSS', hash: 'SHA-256' },
      false, ['verify']
    );
    const sig  = b64ToBytes(SIG_B64);
    const data = new TextEncoder().encode(password);
    return crypto.subtle.verify(
      { name: 'RSA-PSS', saltLength: SALT_LEN },
      pubKey, sig, data
    );
  }

  const overlay = document.getElementById('login-overlay');
  const input   = document.getElementById('login-input');
  const btn     = document.getElementById('login-btn');
  const err     = document.getElementById('login-err');

  window.__bootApp = function bootApp() {
    overlay.style.display = 'none';
    if (typeof load === 'function') { load(); render(); }
  };

  if (sessionStorage.getItem(SS_KEY) === '1') {
    queueMicrotask(() => window.__bootApp());
    return;
  }

  async function attempt() {
    err.textContent = '';
    const pw = input.value;
    if (!pw) { err.textContent = '請輸入通行碼'; return; }
    btn.disabled = true;
    try {
      const ok = await verify(pw);
      if (ok) {
        sessionStorage.setItem(SS_KEY, '1');
        window.__bootApp();
      } else {
        err.textContent = '通行碼錯誤';
        input.value = '';
        input.focus();
      }
    } catch {
      err.textContent = '驗證失敗，請重試';
    } finally {
      btn.disabled = false;
    }
  }

  btn.addEventListener('click', attempt);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') attempt(); });
  requestAnimationFrame(() => input.focus());
})();

// ── localStorage keys ─────────────────────────────────
const LS = {
  TABS:   'toolhub_tabs',
  ACTIVE: 'toolhub_active',
  SW:     'toolhub_sidebarWidth',
  USAGE:  'toolhub_usage',   // { [toolId]: { n: count, t: lastOpenedMs } }
  CAT:    'toolhub_category',
};

// ── State ─────────────────────────────────────────────
let tabs     = [];   // { uid, linkId, name, url }
let active   = null; // uid, or null = 總覽
let usage    = {};
let category = '';   // '' = 全部
let query    = '';

function lsGet(key, fallback) {
  try { const v = localStorage.getItem(key); return v == null ? fallback : v; } catch { return fallback; }
}
function lsSet(key, value) {
  try { localStorage.setItem(key, value); } catch {}
}

// ── Persistence ───────────────────────────────────────
function load() {
  try {
    tabs   = JSON.parse(lsGet(LS.TABS, '[]')) || [];
    active = lsGet(LS.ACTIVE, '') || null;
    tabs = tabs.filter(t => LINK_BY_ID.has(t.linkId));
    if (!tabs.find(t => t.uid === active)) active = null;
  } catch { tabs = []; active = null; }
  try { usage = JSON.parse(lsGet(LS.USAGE, '{}')) || {}; } catch { usage = {}; }
  category = lsGet(LS.CAT, '');
  if (category && !TOOL_GROUPS.some(g => g.name === category)) category = '';
}

function save() {
  lsSet(LS.TABS,   JSON.stringify(tabs));
  lsSet(LS.ACTIVE, active ?? '');
}

// ── Helpers ───────────────────────────────────────────
const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
const esc = s  => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const pad = n  => String(n).padStart(2, '0');

function fmtWhen(ms) {
  if (!ms) return '';
  const d = new Date(ms), now = new Date();
  const hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (d.toDateString() === now.toDateString()) return `今天 ${hm}`;
  return `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${hm}`;
}

function matches(link) {
  if (category && link.group.name !== category) return false;
  if (!query) return true;
  const hay = (link.name + ' ' + link.desc + ' ' + link.url + ' ' + link.group.name).toLowerCase();
  return query.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}

// ── Render ────────────────────────────────────────────
function render() {
  renderTabs();
  renderPanes();
  renderStats();
  renderCategories();
  renderRecent();
  renderGrid(false);
}

// 快點兩下分頁＝在新視窗開啟該工具（畫面太小被擋住時用）
// 不用原生 dblclick：分頁點一下會重繪 DOM，dblclick 會被吃掉，改用時間差判定
let lastTabTap = { uid: null, t: 0 };

function renderTabs() {
  const ct = document.getElementById('tabs-container');
  ct.innerHTML = '';
  document.getElementById('close-all-btn').classList.toggle('visible', tabs.length > 0);

  const home = document.createElement('div');
  home.className = 'tab home' + (active === null ? ' active' : '');
  home.textContent = '總覽';
  home.title = '回到工具總覽';
  home.addEventListener('click', () => activateTab(null));
  ct.appendChild(home);

  tabs.forEach(tab => {
    const link = LINK_BY_ID.get(tab.linkId);
    const el = document.createElement('div');
    el.className = 'tab' + (tab.uid === active ? ' active' : '');
    el.dataset.uid = tab.uid;
    el.draggable = true;
    el.title = `${tab.name}（快點兩下＝另開新視窗）`;
    el.innerHTML = `<span class="tab-dot" style="background:${esc(link.group.color)}"></span>` +
      `<span class="tab-name">${esc(tab.name)}</span><span class="tab-close" title="關閉">×</span>`;
    el.addEventListener('click', e => {
      if (e.target.classList.contains('tab-close')) { closeTab(tab.uid); return; }
      const now = Date.now();
      if (lastTabTap.uid === tab.uid && now - lastTabTap.t < 400) {
        lastTabTap = { uid: null, t: 0 };
        window.open(tab.url, '_blank');
        return;
      }
      lastTabTap = { uid: tab.uid, t: now };
      activateTab(tab.uid);
    });
    el.addEventListener('dragstart',  tabDragStart);
    el.addEventListener('dragover',   tabDragOver);
    el.addEventListener('dragleave',  tabDragLeave);
    el.addEventListener('drop',       tabDrop);
    el.addEventListener('dragend',    tabDragEnd);
    ct.appendChild(el);
  });

  ct.querySelector('.tab.active')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

function renderPanes() {
  const ct = document.getElementById('content');
  const currentIds = new Set(tabs.map(t => t.uid));

  ct.querySelectorAll('.iframe-pane').forEach(p => {
    if (!currentIds.has(p.dataset.uid)) p.remove();
  });

  tabs.forEach(tab => {
    let pane = ct.querySelector(`.iframe-pane[data-uid="${tab.uid}"]`);
    if (!pane) {
      pane = document.createElement('div');
      pane.className   = 'iframe-pane';
      pane.dataset.uid = tab.uid;
      pane.dataset.url = tab.url;
      ct.appendChild(pane);
    }
    // Lazy load: only the active tab gets an iframe; background tabs stay empty
    // until the user switches to them.
    if (tab.uid === active && !pane.querySelector('iframe')) {
      const frame = document.createElement('iframe');
      // 權限政策必須在 src 載入前就設好，否則 geolocation 等權限不會生效
      frame.allow = 'geolocation; fullscreen; display-capture; camera; microphone; clipboard-write; clipboard-read';
      frame.setAttribute('allowfullscreen', '');
      frame.src = pane.dataset.url;
      pane.appendChild(frame);
    }
  });

  ct.querySelectorAll('.iframe-pane').forEach(p =>
    p.classList.toggle('active', p.dataset.uid === active));

  document.getElementById('home').hidden = active !== null;
}

function renderStats() {
  const total = Object.values(usage).reduce((s, u) => s + (u.n || 0), 0);
  let top = null;
  for (const [id, u] of Object.entries(usage)) {
    if (LINK_BY_ID.has(id) && (!top || u.n > top.n)) top = { id, n: u.n };
  }
  document.getElementById('st-tools').textContent = LINKS.length;
  document.getElementById('st-open').textContent  = tabs.length;
  document.getElementById('st-total').textContent = total.toLocaleString();
  document.getElementById('st-top').textContent   = top ? LINK_BY_ID.get(top.id).name : '—';
}

function renderCategories() {
  const list = document.getElementById('cat-list');
  const items = [{ name: '', label: '全部', color: 'var(--accent)', n: LINKS.length },
    ...TOOL_GROUPS.map(g => ({ name: g.name, label: g.name, color: g.color, n: g.tools.length }))];

  list.innerHTML = items.map(it =>
    `<button type="button" class="cat${it.name === category ? ' active' : ''}" data-cat="${esc(it.name)}" style="--c:${it.color}">` +
    `<span class="cat-dot"></span><span class="cat-name">${esc(it.label)}</span>` +
    `<span class="cat-count">${it.n}</span></button>`).join('');

  document.getElementById('cat-bar').innerHTML = TOOL_GROUPS.map(g =>
    `<span style="--c:${g.color};flex:${g.tools.length}" title="${esc(g.name)} ${g.tools.length}"></span>`).join('');
}

function renderRecent() {
  const recent = Object.entries(usage)
    .filter(([id]) => LINK_BY_ID.has(id))
    .sort((a, b) => b[1].t - a[1].t)
    .slice(0, 10);
  const el = document.getElementById('recent-list');
  if (!recent.length) { el.innerHTML = '<div class="recent-empty">還沒有開過任何工具</div>'; return; }
  el.innerHTML = recent.map(([id, u]) => {
    const link = LINK_BY_ID.get(id);
    return `<button type="button" class="recent" data-id="${esc(id)}" title="${esc(link.name)}">` +
      `<span class="cat-dot" style="--c:${link.group.color}"></span>` +
      `<span class="recent-name">${esc(link.name)}</span>` +
      `<span class="recent-time">${esc(fmtWhen(u.t))}</span></button>`;
  }).join('');
}

function renderGrid(animate) {
  const grid = document.getElementById('grid');
  const shown = LINKS.filter(matches);
  const openIds = new Set(tabs.map(t => t.linkId));

  document.getElementById('result-count').textContent = `顯示 ${shown.length} / ${LINKS.length} 個`;

  if (!shown.length) {
    grid.innerHTML = `<div id="no-result">找不到符合「${esc(query)}」的工具</div>`;
    return;
  }

  grid.innerHTML = shown.map((link, i) => {
    const u = usage[link.id];
    const n = u?.n || 0;
    return `<button type="button" class="card${animate ? ' enter' : ''}${openIds.has(link.id) ? ' is-open' : ''}" ` +
      `data-id="${esc(link.id)}" style="--c:${link.group.color};--d:${Math.min(i * 18, 260)}ms">` +
      `<div class="card-head"><span class="badge">${esc(link.group.name)}</span>` +
      `<span class="card-time">${u ? esc(fmtWhen(u.t)) : '尚未開啟'}</span>` +
      `<span class="card-uses${n ? '' : ' zero'}">${n ? `開啟 ${n} 次` : openIds.has(link.id) ? '分頁中' : ''}</span></div>` +
      `<div class="card-title">${esc(link.name)}</div>` +
      `<p class="card-desc">${esc(link.desc)}</p>` +
      `<span class="card-url">${esc(link.url)}</span></button>`;
  }).join('');
}

// ── Actions ───────────────────────────────────────────
function recordUse(id) {
  const u = usage[id] || { n: 0, t: 0 };
  u.n += 1;
  u.t = Date.now();
  usage[id] = u;
  lsSet(LS.USAGE, JSON.stringify(usage));
}

function openLink(link) {
  recordUse(link.id);
  const existing = tabs.find(t => t.linkId === link.id);
  if (existing) { activateTab(existing.uid); return; }
  const tab = { uid: uid(), linkId: link.id, name: link.name, url: link.url };
  tabs.push(tab);
  active = tab.uid;
  save(); render();
}

function activateTab(id) { active = id; save(); render(); }

function closeTab(id) {
  const idx = tabs.findIndex(t => t.uid === id);
  if (idx === -1) return;
  tabs.splice(idx, 1);
  if (active === id)
    active = tabs.length ? tabs[Math.min(idx, tabs.length - 1)].uid : null;
  save(); render();
}

function setCategory(name) {
  category = name;
  lsSet(LS.CAT, name);
  if (active !== null) { active = null; save(); renderTabs(); renderPanes(); }
  renderCategories();
  renderGrid(true);
  document.getElementById('grid').scrollTop = 0;
}

document.getElementById('cat-list').addEventListener('click', e => {
  const btn = e.target.closest('.cat');
  if (btn) setCategory(btn.dataset.cat);
});
document.getElementById('recent-list').addEventListener('click', e => {
  const btn = e.target.closest('.recent');
  if (btn) openLink(LINK_BY_ID.get(btn.dataset.id));
});
document.getElementById('grid').addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (card) openLink(LINK_BY_ID.get(card.dataset.id));
});

// ── Search ────────────────────────────────────────────
const searchInput = document.getElementById('search');
searchInput.addEventListener('input', () => {
  query = searchInput.value.trim();
  renderGrid(false);
});
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const first = document.querySelector('#grid .card');
    if (first) openLink(LINK_BY_ID.get(first.dataset.id));
  } else if (e.key === 'Escape') {
    searchInput.value = ''; query = ''; renderGrid(false); searchInput.blur();
  }
});
document.addEventListener('keydown', e => {
  if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = document.activeElement?.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (document.getElementById('login-overlay').style.display !== 'none') return;
  e.preventDefault();
  if (active !== null) activateTab(null);
  searchInput.focus();
  searchInput.select();
});

(function () {
  const el = document.getElementById('clock');
  const tick = () => { el.textContent = new Date().toLocaleTimeString('zh-TW'); };
  tick();
  setInterval(tick, 1000);

// ── Custom confirm modal ──────────────────────────────
const confirmModal = (() => {
  const overlay = document.getElementById('confirm-overlay');
  const msgEl   = document.getElementById('confirm-msg');
  const okBtn   = document.getElementById('confirm-ok');
  const cancel  = document.getElementById('confirm-cancel');
  let resolver  = null;

  function close(result) {
    overlay.classList.remove('visible');
    document.removeEventListener('keydown', onKey);
    const r = resolver; resolver = null;
    if (r) r(result);
  }
  function onKey(e) {
    if (e.key === 'Escape') close(false);
    else if (e.key === 'Enter') close(true);
  }

  okBtn.addEventListener('click', () => close(true));
  cancel.addEventListener('click', () => close(false));
  overlay.addEventListener('click', e => { if (e.target === overlay) close(false); });

  return (message) => new Promise(resolve => {
    msgEl.textContent = message;
    resolver = resolve;
    overlay.classList.add('visible');
    document.addEventListener('keydown', onKey);
    requestAnimationFrame(() => okBtn.focus());
  });
})();

async function closeAllTabs() {
  if (!tabs.length) return;
  const ok = await confirmModal(`確定關閉全部 ${tabs.length} 個分頁？`);
  if (!ok) return;
  tabs = [];
  active = null;
  save(); render();
}

document.getElementById('close-all-btn').addEventListener('click', closeAllTabs);

// ── Drag & Drop (tabs) ────────────────────────────────
let dragUid = null;

function tabDragStart(e) {
  dragUid = e.currentTarget.dataset.uid;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function tabDragOver(e) {
  e.preventDefault();
  const tgt = e.currentTarget;
  if (tgt.dataset.uid === dragUid) return;
  const half = tgt.getBoundingClientRect().left + tgt.offsetWidth / 2;
  tgt.classList.toggle('drag-over-left',  e.clientX <  half);
  tgt.classList.toggle('drag-over-right', e.clientX >= half);
}
function tabDragLeave(e) {
  e.currentTarget.classList.remove('drag-over-left', 'drag-over-right');
}
function tabDrop(e) {
  e.preventDefault();
  const tgt = e.currentTarget;
  tgt.classList.remove('drag-over-left', 'drag-over-right');
  const targetUid = tgt.dataset.uid;
  if (!dragUid || dragUid === targetUid) return;

  let fromIdx = tabs.findIndex(t => t.uid === dragUid);
  let toIdx   = tabs.findIndex(t => t.uid === targetUid);
  if (fromIdx === -1 || toIdx === -1) return;

  const insertAfter = e.clientX >= tgt.getBoundingClientRect().left + tgt.offsetWidth / 2;
  if (insertAfter) toIdx += 1;
  if (toIdx > fromIdx) toIdx -= 1;

  const [moved] = tabs.splice(fromIdx, 1);
  tabs.splice(toIdx, 0, moved);
  save(); renderTabs();
}
function tabDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.tab').forEach(t =>
    t.classList.remove('drag-over-left', 'drag-over-right'));
  dragUid = null;
}

// ── Sidebar resize ────────────────────────────────────
(function () {
  const handle  = document.getElementById('sidebar-resize');
  const sidebar = document.getElementById('sidebar');
  let resizing = false, startX, startW;

  const saved = lsGet(LS.SW, '');
  if (saved) sidebar.style.width = saved;

  handle.addEventListener('mousedown', e => {
    resizing = true; startX = e.clientX; startW = sidebar.offsetWidth;
    handle.classList.add('active');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    // iframes swallow mousemove; disable them while dragging
    document.querySelectorAll('.iframe-pane iframe').forEach(f => { f.style.pointerEvents = 'none'; });
  });
  document.addEventListener('mousemove', e => {
    if (!resizing) return;
    sidebar.style.width = Math.max(200, Math.min(420, startW + e.clientX - startX)) + 'px';
  });
  document.addEventListener('mouseup', () => {
    if (!resizing) return;
    resizing = false;
    handle.classList.remove('active');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    document.querySelectorAll('.iframe-pane iframe').forEach(f => { f.style.pointerEvents = ''; });
    lsSet(LS.SW, sidebar.style.width);
  });
})();

// ── Init ──────────────────────────────────────────────
// load()/render() are deferred: bootApp() (in the login IIFE) calls them
// after authentication succeeds, so iframes don't load behind the overlay
// and steal focus from the password input.

// ── PWA ───────────────────────────────────────────────
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}

(function () {
  const btn = document.getElementById('install-btn');
  let deferred = null;

  if (window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true) {
    return;
  }

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferred = e;
    btn.classList.add('visible');
  });

  btn.addEventListener('click', async () => {
    if (!deferred) return;
    deferred.prompt();
    try { await deferred.userChoice; } catch {}
    deferred = null;
    btn.classList.remove('visible');
  });

  window.addEventListener('appinstalled', () => {
    btn.classList.remove('visible');
    deferred = null;
  });
})();
</script>
